name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ccw-hands-on-lab/**"
      - "20261116/**"
      - "20261123/**"
      - "workshop-v2/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site
        run: |
          mkdir -p _site/20261116 _site/20261123 _site/workshop-v2
          cp -a ccw-hands-on-lab/. _site/
          # The November 16-17 event is the site's main page: overlay its files
          # on the root. Same-named general lab pages (index.html, eDM.html,
          # ClaudeCode_*.html) are replaced; assets/, v1/ and START_HERE.txt stay.
          cp -a 20261116/. _site/
          cp -a 20261116/. _site/20261116/
          cp -a 20261123/. _site/20261123/
          cp -a workshop-v2/. _site/workshop-v2/
          # Offline archive linked from every lab toolbar: top-level pages,
          # START_HERE.txt and assets/ (no v1/), with the ZIP button removed.
          offline=$(mktemp -d)
          cp -a ccw-hands-on-lab/. "$offline/"
          rm -rf "$offline/v1"
          sed -i 's#<!-- zip-download -->.*<!-- /zip-download -->##' "$offline"/*.html
          (cd "$offline" && zip -qr "$GITHUB_WORKSPACE/_site/ClaudeCode_Workshop_HandsOnLab.zip" .)
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
